{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section>
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
